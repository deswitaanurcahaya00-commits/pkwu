function jm(e){const r=jel.getBoundingClientRect(),dx=e.clientX-r.left-r.width/2,dy=e.clientY-r.top-r.height/2,l=Math.min(1,Math.hypot(dx,dy)/45),an=Math.atan2(dy,dx);jx=Math.cos(an)*l;jy=Math.sin(an)*l;jel.firstElementChild.style.transform=`translate(${jx*40}px,${jy*40}px)`}
jel.addEventListener('pointerdown',e=>{jp=e.pointerId;jel.setPointerCapture(e.pointerId);jm(e)});jel.addEventListener('pointermove',e=>{if(jp===e.pointerId)jm(e)});
const jr=()=>{jp=null;jx=jy=0;jel.firstElementChild.style.transform=''};jel.addEventListener('pointerup',jr);jel.addEventListener('pointercancel',jr);
function fpOn(v){fp=v;ctl.enabled=!v;jel.style.display=v?'block':'none';if(v){mode='view';tool=false;pend=null;clearMark();document.body.dataset.mode='view';select(null);cam.position.set(0,1.6,3.3);yaw=0;pitch=-.05;tr=false;toast('Orang pertama: WASD / panah / joystick untuk jalan, seret layar untuk melihat, ketuk panel listrik untuk breaker')}else view('iso');ui()}
/* ---------- boot ---------- */
function rs(){const w=innerWidth,h=innerHeight;rd.setSize(w,h,false);cam.aspect=w/h;cam.updateProjectionMatrix()}
addEventListener('resize',rs);ctl.addEventListener('start',()=>tr=false);
rs();theme(R.dataset.theme||'light');let d;try{d=JSON.parse(localStorage.getItem(KEY))}catch(e){}load(d&&d.items&&d.items.length?d:DEF());
const k0=cam.aspect<1?1.55:1;cam.position.set(12*k0,14*k0,14*k0);view('iso');
setInterval(tick,250);setTimeout(()=>toast('Seret untuk memutar · dua jari / klik kanan untuk geser · cubit untuk zoom'),600);
rd.setAnimationLoop(t=>{if(fp){const dt=Math.min(.05,(t-last)/1000),f=(keys.w||keys.arrowup?1:0)-(keys.s||keys.arrowdown?1:0)-jy,sd=(keys.d?1:0)-(keys.a?1:0)+jx,v=(keys.shift?4:2.2)*dt;yaw+=((keys.arrowleft?1:0)-(keys.arrowright?1:0))*1.8*dt;cam.position.x=THREE.MathUtils.clamp(cam.position.x+(-Math.sin(yaw)*f+Math.cos(yaw)*sd)*v,-5.7,5.7);cam.position.z=THREE.MathUtils.clamp(cam.position.z+(-Math.cos(yaw)*f-Math.sin(yaw)*sd)*v,-3.7,3.7);cam.position.y=1.6;cam.rotation.set(pitch,yaw,0,'YXZ')}else{if(tr){cam.position.lerp(tp,.08);ctl.target.lerp(tl,.08);if(cam.position.distanceTo(tp)<.05)tr=false}ctl.update()}pulses(t);last=t;const s=.7+.3*Math.sin(t/260);M.ledG.emissiveIntensity=s;M.ledB.emissiveIntensity=1.3-s;const sh=pres||mode!='edit';tags.forEach(([id,e])=>{const o=byId(id);if(!o||!sh){e.style.display='none';return}tv.set(o.position.x,o.position.y+T[o.userData.t].ah+.55,o.position.z).project(cam);e.style.display=tv.z<1?'':'none';e.style.transform=`translate(${(tv.x*.5+.5)*innerWidth}px,${(.5-tv.y*.5)*innerHeight}px) translate(-50%,-100%)`});rd.render(sc,cam)});
